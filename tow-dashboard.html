<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>داشبورد يدکش|ناجي راه</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<!--
نسخهٔ نوینِ CSS + پنل‌ها + سیستم Toast
جایگزین کن داخل فایل HTML (در head و body) یا هرجایی که قبلاً پنل‌ها بود.
-->
<style>
  :root{
    --bg:#0f1724;           /* برای المان‌های تیره */
    --accent:#2563eb;       /* آبی اصلی */
    --accent-2:#7c3aed;     /* بنفش ثانوی */
    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.10);
    --card-bg: rgba(255,255,255,0.98);
    --muted: #94a3b8;
    --success: #16a34a;
    --danger: #ef4444;
    --shadow: 0 10px 30px rgba(2,6,23,0.45);
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --glass-border: rgba(255,255,255,0.06);
    --glass-blur: 8px;
  }

  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter, "Tahoma", "Vazir", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
  html,body{height:100%;width:100%;background:linear-gradient(180deg,#f6f8fb 0%, #eef2f7 100%);direction:rtl;color:#0b1220}
  a{color:inherit}

  /* Map */
  #mapContainer{height:100vh;width:100%;position:relative;padding:18px}
  #map{
    height:calc(100vh - 36px);
    width:100%;
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:2px solid rgba(15,23,36,0.06);
    box-shadow: var(--shadow);
    background:linear-gradient(180deg, #e9eef8 0%, #f7fbff 100%);
  }

  /* Toggle floating button */
  #toggleBtn{
    position:absolute; top:26px; right:26px; z-index:1400;
    display:grid; place-items:center;
    width:56px;height:56px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;font-size:22px;cursor:pointer;
    box-shadow: 0 8px 28px rgba(37,99,235,0.18);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  #toggleBtn:hover{ transform:translateY(-3px); box-shadow: 0 12px 36px rgba(37,99,235,0.22) }

  /* ================== پنل کشویی (راست) ================== */
  #slidePanel{
    position:absolute; top:18px; right:18px; z-index:1500;
    width:340px; max-width:92vw; height:calc(100vh - 36px);
    border-radius:16px; overflow:auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(250,250,252,0.96));
    box-shadow: 0 18px 50px rgba(8,15,30,0.12);
    padding:18px; transform: translateX(380px);
    transition: transform .36s cubic-bezier(.2,.9,.2,1);
    display:flex; flex-direction:column; gap:14px;
    border:1px solid rgba(11,18,32,0.03);
  }
  #slidePanel.open{ transform: translateX(0); }

  #slidePanel .panel-header{
    display:flex; align-items:center; gap:12px;
  }
  #slidePanel h2{ font-size:1.15rem; color:#0b1220; margin:0; font-weight:700 }
  #slidePanel p.lead{ color:var(--muted); font-size:0.92rem; margin-top:-4px }

  #slidePanel .photo-box{
    display:flex; gap:12px; align-items:center;
    background:linear-gradient(180deg, #fff, #fbfdff);
    padding:10px; border-radius:12px; border:1px solid rgba(10,20,40,0.03);
  }
  #slidePanel #photoPreview{
    width:84px; height:84px; border-radius:12px; object-fit:cover; flex-shrink:0;
    border:1px solid rgba(14,20,30,0.04); box-shadow:0 6px 18px rgba(9,12,20,0.06);
  }
  #slidePanel input[type="file"]{
    display:block; width:100%;
    padding:8px; border-radius:8px; border:1px dashed rgba(11,18,32,0.06);
    background:transparent; font-size:0.9rem; color:var(--muted);
  }

  #slidePanel .controls{ display:flex; flex-direction:column; gap:10px; margin-top:6px }
  #slidePanel .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:10px; font-weight:600; cursor:pointer;
    border:none; font-size:0.95rem;
  }
  #slidePanel .btn-success{ background: linear-gradient(90deg,var(--success),#059669); color:#fff; box-shadow:0 8px 26px rgba(16,185,129,0.12) }
  #slidePanel .btn-secondary{ background: linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 8px 26px rgba(59,130,246,0.10) }
  #slidePanel .btn-ghost{ background:transparent; border:1px solid rgba(11,18,32,0.06); color:#0b1220 }

  /* route info card */
  .route-card{ background:linear-gradient(180deg,#ffffff,#fbfdff); border-radius:12px; padding:12px; box-shadow:0 8px 20px rgba(8,12,30,0.06); border:1px solid rgba(11,18,32,0.03) }
  .route-card .meta{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700 }
  .route-card small{ color:var(--muted); font-weight:600; display:block; margin-top:4px }

  /* ================== پنل پايين: درخواست راننده ================== */
  #driverRequestPanel{
    display:none; position:fixed; left:18px; right:18px; bottom:18px; margin:auto;
    max-width:980px; z-index:1600; border-radius:14px; padding:14px;
    background: linear-gradient(180deg,#ffffff,#f8fbff);
    box-shadow: 0 18px 54px rgba(8,12,30,0.12); border:1px solid rgba(11,18,32,0.03);
    transform: translateY(40px); opacity:0; transition: all .32s cubic-bezier(.2,.9,.2,1);
  }
  #driverRequestPanel.show{ transform: translateY(0); opacity:1; display:flex }
  #driverRequestPanel .row{ display:flex; gap:14px; align-items:center; width:100% }
  #driverRequestPanel img{ width:72px; height:72px; border-radius:12px; object-fit:cover; border:1px solid rgba(10,20,30,0.04) }
  #driverRequestPanel .info{ flex:1; display:flex; flex-direction:column; gap:6px }
  #driverRequestPanel .meta{ color:var(--muted); font-size:0.92rem }

  #driverRequestPanel .actions{ display:flex; gap:10px; align-items:center }
  #driverRequestPanel .actions .btn{ min-width:110px; justify-content:center }

  /* ================== پنل مأموریت ================== */
  #towTripPanel{
    display:none; position:fixed; left:18px; right:18px; bottom:18px; margin:auto;
    max-width:980px; z-index:1600; border-radius:14px; padding:14px;
    background: linear-gradient(180deg,#fffdf7,#fff9ef);
    box-shadow: 0 12px 38px rgba(15,20,30,0.08); border:1px solid rgba(11,18,32,0.03);
    transform: translateY(40px); opacity:0; transition: all .32s cubic-bezier(.2,.9,.2,1);
  }
  #towTripPanel.show{ transform: translateY(0); opacity:1; display:flex }
  #towTripPanel img{ width:72px; height:72px; border-radius:12px; object-fit:cover; border:1px solid rgba(10,20,30,0.04) }

  /* small text */
  .muted{ color:var(--muted); font-size:0.92rem }

  /* ================== Toast (alerts) ================== */
  #toastContainer{
    position:fixed; left:50%; transform:translateX(-50%); top:20px;
    z-index:9999; display:flex; flex-direction:column; gap:10px; align-items:center;
    pointer-events:none; width: 92vw; max-width:640px;
  }
  .toast{
    pointer-events:auto;
    min-width:240px; max-width:100%;
    display:flex; gap:12px; align-items:center;
    padding:10px 14px; border-radius:12px; box-shadow:0 8px 26px rgba(2,6,23,0.18);
    color:#fff; font-weight:600; animation: slideDown .28s ease;
    border:1px solid rgba(255,255,255,0.06);
    background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  }
  .toast.info{ background: linear-gradient(90deg,#2563eb,#7c3aed) }
  .toast.success{ background: linear-gradient(90deg,#10b981,#059669) }
  .toast.warn{ background: linear-gradient(90deg,#f59e0b,#f97316) }
  .toast.error{ background: linear-gradient(90deg,#ef4444,#dc2626) }
  .toast svg{ width:20px;height:20px; flex-shrink:0; opacity:0.95 }
  .toast .txt{ flex:1; font-size:0.95rem; line-height:1.2 }
  .toast .close{ margin-left:8px; cursor:pointer; opacity:0.9; border-radius:8px; padding:6px }

  @keyframes slideDown{ from{ transform: translateY(-8px); opacity:0 } to{ transform: translateY(0); opacity:1 } }

  /* responsive tweaks */
  @media (max-width:720px){
    #slidePanel{ width:92vw; right:8px; left:auto; transform: translateX(360px) }
    #driverRequestPanel, #towTripPanel{ left:10px; right:10px; bottom:12px; padding:12px }
    #map{ height:calc(100vh - 72px) }
  }
</style>

<!-- Toast container (place near end of body) -->
<div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<!--
توجه: پنل‌ها (slidePanel, driverRequestPanel, towTripPanel) باید با همان id‌ها در صفحه باشند.
در ادامه نمونه HTML ساختار پنل با کلاس‌های جدید نمایش داده شده است؛ اگر قبلاً مشابه داشتی کافیست idها را حفظ کنی.
-->

<!-- بازنویسی ساختار داخلی slidePanel (مثال) -->
<div id="slidePanel" aria-hidden="true" class="">
  <div class="panel-header">
    <div style="flex:1">
      <h2>داشبورد يدک‌کش</h2>
      <p class="lead muted">آماده به‌کار — درخواست‌های نزدیک را دریافت کن</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost" onclick="togglePanel()" aria-label="بستن پنل">✕</button>
    </div>
  </div>

  <div class="photo-box" style="margin-top:6px">
    <img id="photoPreview" src="https://via.placeholder.com/100" alt="پیش‌نمایش" />
    <div style="flex:1">
      <input id="photoInput" type="file" accept="image/*" onchange="previewPhoto(event)" />
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-success" onclick="saveTow()">ثبت یدک‌کش</button>
        <button class="btn btn-secondary" onclick="simulateReceive()">شبیه‌سازی</button>
      </div>
    </div>
  </div>

  <div class="route-card" style="margin-top:6px">
    <div class="meta">
      <div>اطلاعات مسیر</div>
      <div style="font-size:0.9rem;color:var(--muted)">به‌روز</div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;align-items:center">
      <div style="flex:1">
        <div id="towDistance" style="font-weight:700">فاصله: -</div>
        <small id="towDuration">زمان تقریبی: -</small>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-ghost" onclick="setCurrentLocation()">مکان من</button>
      </div>
    </div>
  </div>

  <div style="flex:1"></div>

  <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px">
    <small class="muted">نسخهٔ پنل — نَجی راه</small>
  </div>
</div>

<!-- پنل درخواست (پایین) -->
<div id="driverRequestPanel" role="dialog" aria-modal="true" class="">
  <div class="row" style="width:100%">
    <img id="reqDriverImage" src="https://via.placeholder.com/64" alt="driver" />
    <div class="info">
      <div id="driverName" style="font-weight:700">نام: -</div>
      <div id="driverPhone" class="muted">تلفن: -</div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <div id="driverCoords" class="muted">مبدا: -</div>
        <div id="driverDest" class="muted">مقصد: -</div>
      </div>
    </div>

    <div class="actions">
      <button id="btnAcceptRequest" class="btn btn-success">قبول</button>
      <button id="btnRejectRequest" class="btn btn-danger">رد</button>
    </div>
  </div>
</div>

<!-- پنل مأموریت -->
<div id="towTripPanel" role="status" class="">
  <div style="display:flex;gap:12px;align-items:center">
    <img id="tripDriverImage" src="https://via.placeholder.com/64" alt="driver" />
    <div style="flex:1">
      <div id="tripDriverName" style="font-weight:700">نام: -</div>
      <div id="tripDriverPhone" class="muted">تلفن: -</div>
      <div id="tripDriverPlate" class="muted">پلاک: -</div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="btnTowEnd" class="btn btn-success">پایان</button>
      <button id="btnTowCancel" class="btn btn-danger">لغو</button>
    </div>
  </div>
</div>

<script>
  /* ساده‌ترین توابع کمکی UI که احتمالا در کد قبلی به‌صورت global بودند */
  function togglePanel(){ document.getElementById('slidePanel')?.classList.toggle('open'); }

  function previewPhoto(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('photoPreview').src = reader.result; };
    reader.readAsDataURL(file);
  }

  /* سیستم Toast — جایگزین alert */
  (function(){
    const container = document.getElementById('toastContainer');

    function createToast(message, variant='info', timeout=4200){
      const t = document.createElement('div');
      t.className = 'toast ' + (variant || 'info');

      // icon (simple svg)
      const icons = {
        info: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 9h.01M11 17h2v-6h-2v6z" stroke="rgba(255,255,255,0.95)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        success: `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="rgba(255,255,255,0.95)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        warn: `<svg viewBox="0 0 24 24" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke="rgba(255,255,255,0.95)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        error: `<svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="rgba(255,255,255,0.95)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      };

      t.innerHTML = `${icons[variant] || icons.info}<div class="txt">${message}</div><div class="close" title="بستن">✕</div>`;
      container.appendChild(t);

      const closeBtn = t.querySelector('.close');
      const remove = () => { t.style.opacity = 0; setTimeout(()=>t.remove(), 260); };
      closeBtn?.addEventListener('click', remove);

      // auto dismiss
      setTimeout(remove, timeout);
      return t;
    }

    // expose a simple API
    window.showToast = function(message, type='info', timeout=4200){
      createToast(String(message || ''), type, timeout);
    };

    // override native alert to nicer toast (keeps code compatibility)
    window._nativeAlert = window.alert.bind(window);
    window.alert = function(message){ window.showToast(message, 'info', 4200); console.log('alert:', message); };

    // expose also success/error helpers
    window.showSuccess = (m,t)=>window.showToast(m,'success',t||3800);
    window.showError = (m,t)=>window.showToast(m,'error',t||4200);
    window.showWarn = (m,t)=>window.showToast(m,'warn',t||4200);
  })();

  /* small helper: setCurrentLocation placeholder (existing JS will override behavior) */
  function setCurrentLocation(){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition((pos)=>{
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        // If original script defines towPanel and setCurrentLocation, it will be used.
        if(window.towPanel && typeof window.towPanel.setCurrentLocation === 'function'){
          window.towPanel.setCurrentLocation();
          return;
        }
        // otherwise a friendly toast
        showToast('مکان فعلی به‌روزرسانی شد', 'success');
      }, (err)=>{
        showToast('دسترسی به موقعیت مقدور نیست: ' + (err.message || err.code), 'error', 6000);
      });
    } else {
      showToast('مرورگر شما از Geolocation پشتیبانی نمی‌کند', 'warn');
    }
  }
</script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
 /* TowPanel — بازنویسی ساختارمند و بهینه برای پنل یدک‌کش
   قابل قرارگیری مستقیم داخل <script> در HTML (بدون import/export)
   ویژگی‌ها: کلاس‌بندی، مدیریت ایونت‌ها، watchPosition، throttle، cleanup مرتب
*/

(() => {
  'use strict';

  /**
   * تنظیمات قابل تغییر
   */
  const CONFIG = {
    MAP_ID: 'map',
    OSM_TILE: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    OSRM_ROUTE_URL: 'https://router.project-osrm.org/route/v1/driving/',
    SOCKET_URL: 'https://naji-backend.onrender.com',
    TOW_LOCATION_THROTTLE_MS: 3000, // حداقل فاصله زمانی ارسال موقعیت
    DEFAULT_VIEW: { lat: 30.4391, lng: 49.089, zoom: 13 },
    DRIVER_ICON_URL: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
    DEST_ICON_URL: 'https://cdn-icons-png.flaticon.com/512/149/149060.png',
    BEEP_SOUND: 'https://www.soundjay.com/button/beep-07.wav'
  };

  /**
   * ساده‌ترین throttle برای فراخوانی یک تابع با حداقل فاصله زمانی
   */
  function throttle(fn, wait) {
    let last = 0;
    return function (...args) {
      const now = Date.now();
      if (now - last >= wait) {
        last = now;
        try { fn.apply(this, args); } catch (e) { console.error(e); }
      }
    };
  }

  /**
   * تبدیل geojson coords lon,lat -> [lat,lng]
   */
  function coordsToLatLngArray(coords) {
    return coords.map(c => [c[1], c[0]]);
  }

  /**
   * کلاس TowPanel: مدیریت نقشه، سوکت و UI
   */
  class TowPanel {
    constructor(config = {}) {
      this.cfg = { ...CONFIG, ...config };

      // Leaflet state
      this.map = null;
      this.towMarker = null;
      this.driverMarker = null;
      this.destMarker = null;
      this.driverRouteLine = null;
      this.towRouteLine = null;

      // request/trip state
      this.currentRequestId = null;
      this.currentDriverSocketId = null;

      // socket
      this.socket = null;

      // geolocation watch id
      this.watchId = null;

      // elements cache
      this.el = {};

      // bind methods
      this._onReceiveRequest = this._onReceiveRequest.bind(this);
      this._onUpdateDriverLocation = this._onUpdateDriverLocation.bind(this);
      this._onRequestClosed = this._onRequestClosed.bind(this);
      this._onTripEnded = this._onTripEnded.bind(this);
      this._onTripCanceled = this._onTripCanceled.bind(this);
      this._sendTowLocationThrottled = throttle(this._sendTowLocation.bind(this), this.cfg.TOW_LOCATION_THROTTLE_MS);

      this._init();
    }

    /* ========== Initialization ========== */
    _init() {
      try {
        this._cacheElements();
        this._initMap();
        this._initSocket();
        this._bindUI();
        console.log('TowPanel initialized');
      } catch (err) {
        console.error('Initialization error:', err);
      }
    }

    _cacheElements() {
      const ids = [
        'slidePanel', 'photoPreview', 'towName', 'towModel', 'towPhone',
        'towCity', 'towPlate', 'driverRequestPanel', 'towTripPanel',
        'reqDriverImage', 'driverName', 'driverPhone', 'driverCoords', 'driverDest',
        'btnAcceptRequest', 'btnRejectRequest', 'tripDriverName', 'tripDriverPhone',
        'tripDriverPlate', 'tripDriverImage', 'towDistance', 'towDuration',
        'driverPlate'
      ];
      ids.forEach(id => { this.el[id] = document.getElementById(id); });
    }

    _initMap() {
      const el = document.getElementById(this.cfg.MAP_ID);
      if (!el) throw new Error(`Element #${this.cfg.MAP_ID} not found`);

      // initialize map
      this.map = L.map(this.cfg.MAP_ID).setView([this.cfg.DEFAULT_VIEW.lat, this.cfg.DEFAULT_VIEW.lng], this.cfg.DEFAULT_VIEW.zoom);
      L.tileLayer(this.cfg.OSM_TILE, { attribution: '&copy; OpenStreetMap' }).addTo(this.map);
    }

    _initSocket() {
      // create socket and register listeners (ensure old listeners removed first)
      this.socket = io(this.cfg.SOCKET_URL);

      this.socket.on('connect', () => {
        console.log('Socket connected:', this.socket.id);
        this.socket.emit('registerTow');
      });

      // remove and rebind server events (defensive)
      this.socket.off('receiveRequest'); this.socket.on('receiveRequest', this._onReceiveRequest);
      this.socket.off('updateDriverLocation'); this.socket.on('updateDriverLocation', this._onUpdateDriverLocation);
      this.socket.off('requestClosed'); this.socket.on('requestClosed', this._onRequestClosed);
      this.socket.off('tripEnded'); this.socket.on('tripEnded', this._onTripEnded);
      this.socket.off('tripCanceled'); this.socket.on('tripCanceled', this._onTripCanceled);
    }

    _bindUI() {
      // preview photo
      const previewInput = document.querySelector('input[type="file"]');
      if (previewInput) previewInput.addEventListener('change', (e) => this._previewPhoto(e));

      // accept/reject
      if (this.el.btnAcceptRequest) {
        this.el.btnAcceptRequest.addEventListener('click', () => this._acceptRequest());
      }
      if (this.el.btnRejectRequest) {
        this.el.btnRejectRequest.addEventListener('click', () => this._rejectRequest());
      }

      // mission buttons (assume IDs exist on page)
      const btnTowEnd = document.getElementById('btnTowEnd');
      const btnTowCancel = document.getElementById('btnTowCancel');
      if (btnTowEnd) btnTowEnd.addEventListener('click', () => this._endTrip());
      if (btnTowCancel) btnTowCancel.addEventListener('click', () => this._cancelTrip());

      // set current location shortcut if exists
      // (optional button in UI should call window.towPanel.setCurrentLocation())
      window.towPanel = this; // useful for debugging and manual triggering
    }

    /* ========== UI helpers ========== */
    togglePanel() {
      const el = this.el.slidePanel;
      if (el) el.classList.toggle('open');
    }

    _previewPhoto(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { if (this.el.photoPreview) this.el.photoPreview.src = reader.result; };
      reader.readAsDataURL(file);
    }

    /* ========== Geolocation: watch + send throttled ========== */
    startWatchingPosition() {
      if (!navigator.geolocation) {
        alert('مرورگر شما از Geolocation پشتیبانی نمی‌کند');
        return;
      }

      // clear existing watcher
      if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);

      this.watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          this._updateTowMarker([lat, lng]);
          this._sendTowLocationThrottled(lat, lng);
        },
        (err) => {
          console.warn('Geolocation watch error:', err);
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    stopWatchingPosition() {
      if (this.watchId !== null) {
        navigator.geolocation.clearWatch(this.watchId);
        this.watchId = null;
      }
    }

    _updateTowMarker(latlng) {
      if (!this.map) return;
      if (this.towMarker) {
        this.towMarker.setLatLng(latlng);
      } else {
        this.towMarker = L.marker(latlng).addTo(this.map).bindPopup('موقعیت یدک‌کش');
      }
      // Optionally keep map focused (commented to avoid forcing view)
      // this.map.setView(latlng, 14);
    }

    _sendTowLocation(lat, lng) {
      if (!this.socket || !this.socket.connected) return;
      try {
        this.socket.emit('updateTowLocation', { towId: this.socket.id, lat, lng });
      } catch (e) {
        console.error('sendTowLocation failed', e);
      }
    }

    /* ========== Route drawing via OSRM ========== */
    async _fetchRoute(start, end) {
      // start/end can be {lat, lng} or [lat,lng]
      const sLat = start.lat ?? (Array.isArray(start) ? start[0] : start[0]);
      const sLng = start.lng ?? (Array.isArray(start) ? start[1] : start[1]);
      const eLat = end.lat ?? (Array.isArray(end) ? end[0] : end[0]);
      const eLng = end.lng ?? (Array.isArray(end) ? end[1] : end[1]);

      const url = `${this.cfg.OSRM_ROUTE_URL}${sLng},${sLat};${eLng},${eLat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('OSRM response not ok');
        const json = await res.json();
        if (!json.routes || !json.routes.length) return null;
        const route = json.routes[0];
        const coords = coordsToLatLngArray(route.geometry.coordinates);
        return { coords, distance: route.distance, duration: route.duration };
      } catch (err) {
        console.error('Error fetching route:', err);
        return null;
      }
    }

    async _drawRoute(start, end, color = 'blue') {
      const r = await this._fetchRoute(start, end);
      if (!r) return null;
      // remove existing polyline of same type
      if (color === 'blue' && this.driverRouteLine) { this.map.removeLayer(this.driverRouteLine); this.driverRouteLine = null; }
      if (color === 'red' && this.towRouteLine) { this.map.removeLayer(this.towRouteLine); this.towRouteLine = null; }

      const poly = L.polyline(r.coords, { color, weight: 4 }).addTo(this.map);
      // update appropriate reference
      if (color === 'blue') this.driverRouteLine = poly;
      else this.towRouteLine = poly;

      try { this.map.fitBounds(poly.getBounds(), { padding: [40, 40] }); } catch (e) { /* ignore fit errors */ }

      return {
        poly,
        distanceKm: (r.distance / 1000).toFixed(2),
        durationMin: Math.ceil(r.duration / 60)
      };
    }

    /* ========== Request lifecycle handlers (server events) ========== */
    async _onReceiveRequest(data) {
      // defensive cleanup (ensure single active request)
      this._cleanupRequest();

      if (!data || !data.origin || !data.dest) {
        console.warn('receiveRequest with invalid payload', data);
        return;
      }

      this.currentRequestId = data.requestId || (`req-${Date.now()}`);
      this.currentDriverSocketId = data.driverSocketId || data.driverId || null;

      // fill UI panel
      const d = data.driverInfo || {};
      if (this.el.reqDriverImage) this.el.reqDriverImage.src = d.image || 'https://via.placeholder.com/64';
      if (this.el.driverName) this.el.driverName.innerText = d.fullName ? `نام: ${d.fullName}` : 'نام: -';
      if (this.el.driverPhone) this.el.driverPhone.innerText = d.phone ? `تلفن: ${d.phone}` : 'تلفن: -';
      if (this.el.driverCoords && data.origin) this.el.driverCoords.innerText = `مبدا: ${data.origin.lat.toFixed(5)}, ${data.origin.lng.toFixed(5)}`;
      if (this.el.driverDest && data.dest) this.el.driverDest.innerText = `مقصد: ${data.dest.lat.toFixed(5)}, ${data.dest.lng.toFixed(5)}`;
      if (this.el.driverRequestPanel) this.el.driverRequestPanel.style.display = 'block';

      // play beep (best-effort)
      try { new Audio(this.cfg.BEEP_SOUND).play().catch(() => {}); } catch (e) {}

      // place driver marker
      this.driverMarker = L.marker([data.origin.lat, data.origin.lng], {
        icon: L.icon({ iconUrl: this.cfg.DRIVER_ICON_URL, iconSize: [32, 32] })
      }).addTo(this.map).bindPopup('راننده');

      // place dest marker
      this.destMarker = L.marker([data.dest.lat, data.dest.lng], {
        icon: L.icon({ iconUrl: this.cfg.DEST_ICON_URL, iconSize: [32, 32] })
      }).addTo(this.map).bindPopup('مقصد');

      // draw driver->dest route
      await this._drawRoute(data.origin, data.dest, 'blue');

      // if we have tow marker: draw tow->driver route
      if (this.towMarker) {
        const towLatLng = this.towMarker.getLatLng();
        const r = await this._drawRoute([towLatLng.lat, towLatLng.lng], { lat: data.origin.lat, lng: data.origin.lng }, 'red');
        if (r && this.el.towDistance) {
          this.el.towDistance.innerText = `فاصله: ${r.distanceKm} km`;
          this.el.towDuration.innerText = `زمان تقریبی: ${r.durationMin} دقیقه`;
        }
      }
    }

    _onUpdateDriverLocation(data) {
      // server forwards driver live location
      if (!this.currentDriverSocketId) return;
      if (!data || data.driverId !== this.currentDriverSocketId) return;

      const latlng = [data.lat, data.lng];
      if (this.driverMarker) this.driverMarker.setLatLng(latlng);
      else this.driverMarker = L.marker(latlng).addTo(this.map).bindPopup('راننده');

      // update tow->driver route if we have our tow marker
      if (this.towMarker) {
        const towLatLng = this.towMarker.getLatLng();
        this._drawRoute([towLatLng.lat, towLatLng.lng], { lat: data.lat, lng: data.lng }, 'red');
      }
    }

    _onRequestClosed(info) {
      // info may include requestId
      if (info && info.requestId && this.currentRequestId && info.requestId !== this.currentRequestId) return;
      alert(info && info.message ? info.message : 'این درخواست بسته شد.');
      this._cleanupRequest();
    }

    _onTripEnded(info) {
      if (info && info.requestId && this.currentRequestId && info.requestId !== this.currentRequestId) return;
      alert('ماموریت پایان یافت.');
      this._cleanupRequest();
    }

    _onTripCanceled(info) {
      if (info && info.requestId && this.currentRequestId && info.requestId !== this.currentRequestId) return;
      alert('ماموریت لغو شد.');
      this._cleanupRequest();
    }

    /* ========== UI actions: accept/reject/end/cancel ========= */
    _acceptRequest() {
      if (!this.currentRequestId) { alert('درخواستی موجود نیست'); return; }

      const towInfo = {
        fullName: this.el.towName ? this.el.towName.value || 'یدک‌کش' : 'یدک‌کش',
        phone: this.el.towPhone ? this.el.towPhone.value || '' : '',
        plate: this.el.towPlate ? this.el.towPlate.value || '' : '',
        image: this.el.photoPreview ? this.el.photoPreview.src || '' : ''
      };

      // notify server
      this.socket.emit('requestUpdate', { requestId: this.currentRequestId, status: 'accepted', towInfo });

      // show trip panel
      if (this.el.towTripPanel) this.el.towTripPanel.style.display = 'block';
      if (this.el.driverRequestPanel) this.el.driverRequestPanel.style.display = 'none';

      if (this.el.tripDriverName && this.el.driverName) this.el.tripDriverName.innerText = this.el.driverName.innerText;
      if (this.el.tripDriverPhone && this.el.driverPhone) this.el.tripDriverPhone.innerText = this.el.driverPhone.innerText;
      if (this.el.tripDriverImage && this.el.reqDriverImage) this.el.tripDriverImage.src = this.el.reqDriverImage.src || 'https://via.placeholder.com/64';
      if (this.el.tripDriverPlate) this.el.tripDriverPlate.innerText = this.el.driverPlate ? this.el.driverPlate.innerText : 'پلاک: -';
    }

    _rejectRequest() {
      if (!this.currentRequestId) { if (this.el.driverRequestPanel) this.el.driverRequestPanel.style.display = 'none'; return; }
      this.socket.emit('requestUpdate', { requestId: this.currentRequestId, status: 'rejected' });
      this._cleanupRequest();
    }

    _endTrip() {
      if (!this.currentRequestId) { alert('درخواستی وجود ندارد'); return; }
      this.socket.emit('endTrip', { requestId: this.currentRequestId });
      this._cleanupRequest();
    }

    _cancelTrip() {
      if (!this.currentRequestId) { alert('درخواستی وجود ندارد'); return; }
      this.socket.emit('cancelTrip', { requestId: this.currentRequestId });
      this._cleanupRequest();
    }

    /* ========== Cleanup ========== */
    _cleanupRequest() {
      this.currentRequestId = null;
      this.currentDriverSocketId = null;

      try {
        if (this.driverMarker) { this.map.removeLayer(this.driverMarker); this.driverMarker = null; }
        if (this.destMarker) { this.map.removeLayer(this.destMarker); this.destMarker = null; }
        if (this.driverRouteLine) { this.map.removeLayer(this.driverRouteLine); this.driverRouteLine = null; }
        if (this.towRouteLine) { this.map.removeLayer(this.towRouteLine); this.towRouteLine = null; }
      } catch (e) { console.warn('cleanup map layers error', e); }

      if (this.el.driverRequestPanel) this.el.driverRequestPanel.style.display = 'none';
      if (this.el.towTripPanel) this.el.towTripPanel.style.display = 'none';

      // reset trip info UI if present
      if (this.el.tripDriverName) this.el.tripDriverName.innerText = 'نام: -';
      if (this.el.tripDriverPhone) this.el.tripDriverPhone.innerText = 'تلفن: -';
      if (this.el.tripDriverPlate) this.el.tripDriverPlate.innerText = 'پلاک: -';
      if (this.el.tripDriverImage) this.el.tripDriverImage.src = 'https://via.placeholder.com/64';
      if (this.el.towDistance) this.el.towDistance.innerText = 'فاصله: -';
      if (this.el.towDuration) this.el.towDuration.innerText = 'زمان تقریبی: -';
    }

    /* ========== Public helpers ========== */
    // save tow (POST) - ساده و دارای کنترل خطا
    async saveTow() {
      const data = {
        fullName: this.el.towName ? this.el.towName.value : '',
        towModel: this.el.towModel ? this.el.towModel.value : '',
        phone: this.el.towPhone ? this.el.towPhone.value : '',
        towCity: this.el.towCity ? this.el.towCity.value : '',
        plate: this.el.towPlate ? this.el.towPlate.value : ''
      };

      if (!data.fullName) { alert('لطفاً نام یدک‌کش را وارد کنید'); return; }

      try {
        const res = await fetch(`${this.cfg.SOCKET_URL.replace(/^https?:/, 'https:')}/api/tow/signup`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const j = await res.json();
        alert(j.message || 'ثبت انجام شد');
      } catch (err) {
        console.error('saveTow error', err);
        alert('خطا در ثبت (کنسول را چک کنید)');
      }
    }

    // set current location once (خواهی که مکان فعلی را روی نقشه نمایش دهد)
    setCurrentLocation() {
      if (!navigator.geolocation) { alert('مرورگر شما از Geolocation پشتیبانی نمی‌کند'); return; }
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        this._updateTowMarker([lat, lng]);
        this.map.setView([lat, lng], 14);
      }, (err) => {
        alert('دسترسی به موقعیت فعلی امکان‌پذیر نشد: ' + (err.message || err.code));
      });
    }

    // simulate a receiveRequest for local UI testing
    simulateReceive() {
      const origin = { lat: 30.4405, lng: 49.0885 };
      const dest = { lat: 30.4510, lng: 49.0960 };
      const driverInfo = { fullName: 'علی رضایی', phone: '0912xxxxxxx', plate: 'ایران 12 ب 345' };
      // Directly call handler (mimic server)
      this._onReceiveRequest({ requestId: `sim-${Date.now()}`, driverSocketId: 'sim-driver', origin, dest, driverInfo });
    }

    // completely destroy panel: remove listeners, stop watch, disconnect socket
    destroy() {
      try {
        // remove socket listeners
        if (this.socket) {
          this.socket.off('receiveRequest', this._onReceiveRequest);
          this.socket.off('updateDriverLocation', this._onUpdateDriverLocation);
          this.socket.off('requestClosed', this._onRequestClosed);
          this.socket.off('tripEnded', this._onTripEnded);
          this.socket.off('tripCanceled', this._onTripCanceled);
          this.socket.disconnect();
          this.socket = null;
        }
      } catch (e) { /* ignore */ }

      // stop geolocation
      this.stopWatchingPosition();

      // cleanup map layers
      this._cleanupRequest();
      if (this.towMarker) { try { this.map.removeLayer(this.towMarker); } catch (e) { } this.towMarker = null; }
    }
  }

  // create instance
  window.towPanel = new TowPanel();

  // start watching user position automatically (you can change this)
  try { window.towPanel.startWatchingPosition(); } catch (e) { console.warn(e); }

  // expose helpers for debugging / manual triggers
  // e.g., in console: towPanel.simulateReceive(); towPanel.setCurrentLocation();
})();

</script>
